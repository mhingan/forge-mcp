[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forge-mcp"
version = "0.2.0"
description = "MCP server discovery, connection manifests, and integration registry for Forge Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mihaita Hingan" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "forge", "registry", "integrations"]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/mhingan/forge-mcp"
Repository = "https://github.com/mhingan/forge-mcp"
Issues = "https://github.com/mhingan/forge-mcp/issues"

[project.scripts]
forge-mcp = "forge_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_mcp"]
include = ["src/forge_mcp/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
